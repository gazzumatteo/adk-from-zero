<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AG-UI Streaming Dashboard - Article 10</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .header p {
            opacity: 0.9;
            font-size: 14px;
        }

        .content {
            padding: 30px;
        }

        .input-section {
            margin-bottom: 30px;
        }

        .input-section label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            color: #333;
        }

        .input-group {
            display: flex;
            gap: 10px;
        }

        #promptInput {
            flex: 1;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        #promptInput:focus {
            outline: none;
            border-color: #667eea;
        }

        #submitBtn {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        #submitBtn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        #submitBtn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .output-section {
            margin-top: 30px;
        }

        .output-section h2 {
            font-size: 18px;
            margin-bottom: 15px;
            color: #333;
        }

        .output-box {
            background: #f8f9fa;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 20px;
            min-height: 200px;
            max-height: 500px;
            overflow-y: auto;
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            font-size: 13px;
            line-height: 1.5;
            color: #333;
        }

        .output-box.empty {
            color: #999;
            font-style: italic;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .message {
            margin-bottom: 12px;
            padding: 10px;
            border-radius: 4px;
            background: white;
            border-left: 3px solid #667eea;
        }

        .message.start {
            border-left-color: #4caf50;
            background: #f1f8e9;
        }

        .message.response_chunk {
            border-left-color: #667eea;
        }

        .message.tool_call {
            border-left-color: #ff9800;
            background: #fff3e0;
        }

        .message.done {
            border-left-color: #4caf50;
            background: #f1f8e9;
        }

        .message.error {
            border-left-color: #f44336;
            background: #ffebee;
            color: #c62828;
        }

        .loading-spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-left: 10px;
        }

        #submitBtn:disabled .loading-spinner {
            display: inline-block;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .status-bar {
            margin-top: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
            font-size: 13px;
            color: #666;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #4caf50;
            display: inline-block;
            margin-right: 8px;
        }

        .status-indicator.loading {
            background: #ff9800;
        }

        .status-indicator.error {
            background: #f44336;
        }

        .examples {
            margin-bottom: 20px;
            padding: 15px;
            background: #f0f4ff;
            border-radius: 8px;
            font-size: 13px;
        }

        .examples h3 {
            color: #667eea;
            margin-bottom: 8px;
            font-size: 13px;
        }

        .example-button {
            display: inline-block;
            margin: 4px 8px 4px 0;
            padding: 6px 12px;
            background: white;
            border: 1px solid #667eea;
            border-radius: 4px;
            color: #667eea;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }

        .example-button:hover {
            background: #667eea;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>AG-UI Streaming Dashboard</h1>
            <p>Article 10: Agent-to-UI with Server-Sent Events (SSE)</p>
        </div>

        <div class="content">
            <div class="input-section">
                <label for="promptInput">Enter your request:</label>

                <div class="examples">
                    <h3>Try these examples:</h3>
                    <button class="example-button" onclick="setExample('Generate a daily operations report')">Daily Report</button>
                    <button class="example-button" onclick="setExample('Show me current alerts and issues')">Show Alerts</button>
                    <button class="example-button" onclick="setExample('Analyze revenue trend over the last week')">Revenue Trend</button>
                    <button class="example-button" onclick="setExample('What is the status of our system health?')">System Health</button>
                </div>

                <div class="input-group">
                    <input
                        type="text"
                        id="promptInput"
                        placeholder="What would you like to know about your dashboard?"
                        onkeypress="handleKeypress(event)"
                    >
                    <button id="submitBtn" onclick="submitPrompt()">
                        Send
                        <span class="loading-spinner"></span>
                    </button>
                </div>
            </div>

            <div class="output-section">
                <h2>Response Stream:</h2>
                <div id="outputBox" class="output-box empty">
                    <p>Responses will appear here as they're streamed...</p>
                </div>
            </div>

            <div class="status-bar">
                <span>
                    <span id="statusIndicator" class="status-indicator"></span>
                    <span id="statusText">Ready</span>
                </span>
                <span id="streamStats" style="display:none;">
                    Messages: <span id="messageCount">0</span>
                </span>
            </div>
        </div>
    </div>

    <script>
        let eventSource = null;
        let messageCount = 0;

        function setExample(text) {
            document.getElementById('promptInput').value = text;
            document.getElementById('promptInput').focus();
        }

        function handleKeypress(event) {
            if (event.key === 'Enter' && !document.getElementById('submitBtn').disabled) {
                submitPrompt();
            }
        }

        function updateStatus(status, isLoading = false) {
            const indicator = document.getElementById('statusIndicator');
            const text = document.getElementById('statusText');

            indicator.className = 'status-indicator' + (isLoading ? ' loading' : '');
            text.textContent = status;
        }

        function addMessage(type, content) {
            const outputBox = document.getElementById('outputBox');

            // Remove empty message on first real message
            if (outputBox.classList.contains('empty')) {
                outputBox.innerHTML = '';
                outputBox.classList.remove('empty');
            }

            const message = document.createElement('div');
            message.className = `message ${type}`;

            if (type === 'response_chunk') {
                // Append to last chunk if it exists
                const lastMessage = outputBox.lastElementChild;
                if (lastMessage && lastMessage.classList.contains('message response_chunk')) {
                    lastMessage.textContent += content;
                } else {
                    message.textContent = content;
                    outputBox.appendChild(message);
                }
            } else {
                message.textContent = content;
                outputBox.appendChild(message);
            }

            // Scroll to bottom
            outputBox.scrollTop = outputBox.scrollHeight;

            messageCount++;
            document.getElementById('messageCount').textContent = messageCount;
        }

        function submitPrompt() {
            const prompt = document.getElementById('promptInput').value.trim();

            if (!prompt) {
                alert('Please enter a prompt');
                return;
            }

            // Reset
            messageCount = 0;
            document.getElementById('outputBox').innerHTML = '';
            document.getElementById('streamStats').style.display = 'inline';

            // Update UI
            const button = document.getElementById('submitBtn');
            button.disabled = true;
            updateStatus('Processing...', true);

            // Close any existing connection
            if (eventSource) {
                eventSource.close();
            }

            // Send request
            fetch('/api/run', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ prompt }),
            })
                .then((response) => {
                    const reader = response.body.getReader();
                    const decoder = new TextDecoder();
                    let buffer = '';

                    function processStream() {
                        reader.read().then(({ done, value }) => {
                            if (done) {
                                updateStatus('Complete');
                                button.disabled = false;
                                return;
                            }

                            buffer += decoder.decode(value, { stream: true });
                            const lines = buffer.split('\n');

                            for (let i = 0; i < lines.length - 1; i++) {
                                const line = lines[i];

                                if (line.startsWith('data: ')) {
                                    try {
                                        const json = JSON.parse(line.slice(6));
                                        addMessage(json.type, json.message || json.chunk || json.tool || JSON.stringify(json));
                                    } catch (e) {
                                        console.error('Failed to parse:', line);
                                    }
                                }
                            }

                            buffer = lines[lines.length - 1];
                            processStream();
                        });
                    }

                    processStream();
                })
                .catch((error) => {
                    addMessage('error', `Error: ${error.message}`);
                    updateStatus('Error', false);
                    button.disabled = false;
                });
        }

        // Initialize
        updateStatus('Ready');
    </script>
</body>
</html>
