# Cloud Build configuration for Article 12: Production Deployment
# Deploy: gcloud builds submit --config cloudbuild.yaml

steps:
  # Step 1: Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/adk-production-agent:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/adk-production-agent:latest'
      - '.'

  # Step 2: Push to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/adk-production-agent:$COMMIT_SHA'

  # Step 3: Deploy to Cloud Run
  - name: 'gcr.io/cloud-builders/run'
    args:
      - 'deploy'
      - 'adk-production-agent'
      - '--image=gcr.io/$PROJECT_ID/adk-production-agent:$COMMIT_SHA'
      - '--region=us-central1'
      - '--platform=managed'
      - '--memory=2Gi'
      - '--cpu=2'
      - '--timeout=3600s'
      - '--set-env-vars=ENVIRONMENT=production'
      - '--allow-unauthenticated'

images:
  - 'gcr.io/$PROJECT_ID/adk-production-agent:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/adk-production-agent:latest'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'N1_HIGHCPU_8'

timeout: '1800s'

substitutions:
  _SERVICE_NAME: 'adk-production-agent'
  _REGION: 'us-central1'
  _MEMORY: '2Gi'
  _CPU: '2'
