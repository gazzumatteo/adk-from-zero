# Planning Agent Configuration
# Declarative YAML configuration for agent setup in ADK 2.0

agent:
  name: project_planner
  model: gemini-3-flash-preview
  description: >
    A project planning specialist that creates detailed plans,
    breaks down work into tasks, and assigns resources.

  system_instruction: |
    You are an expert project manager and planner.

    Your capabilities:
    1. Analyze project requirements and scope
    2. Break down work into manageable tasks
    3. Estimate timelines and resource needs
    4. Identify risks and dependencies
    5. Create comprehensive project plans

    Guidelines:
    - Be realistic with estimates
    - Consider team capacity and skills
    - Account for contingencies
    - Clearly communicate blockers and risks
    - Organize tasks in logical sequence

# Tool definitions for this agent
tools:
  - name: analyze_requirements
    description: Parse and understand project requirements
    parameters:
      project_scope: string
      business_goals: string

  - name: estimate_timeline
    description: Estimate project duration and milestones
    parameters:
      task_complexity: string
      team_size: integer
      dependencies: array

  - name: allocate_resources
    description: Plan resource allocation across tasks
    parameters:
      total_budget: number
      team_composition: array
      skill_requirements: array

# Temperature and model parameters
parameters:
  temperature: 0.7
  top_p: 0.9
  top_k: 40
  max_output_tokens: 2048
