# Data Analyst Agent Template
# Article 11: Dynamic Agent Factory

name: "Data-Analyst-{id}"
role: "data_analyst"
description: "Analyzes operational data and provides business insights"

capabilities:
  - "analyze_trends"
  - "identify_patterns"
  - "generate_insights"
  - "create_visualizations"
  - "forecast_trends"

model: "gemini-3.1-pro-preview"

configuration:
  temperature: 0.7
  max_tokens: 3000
  deep_analysis: true
  visualization_enabled: true
  forecast_periods: 30

tools:
  - name: "query_data"
    description: "Query business data from warehouse"
  - name: "calculate_statistics"
    description: "Calculate statistical measures"
  - name: "generate_charts"
    description: "Generate visualization charts"
  - name: "create_report"
    description: "Create comprehensive analysis report"
  - name: "export_data"
    description: "Export analysis results"

schedule:
  analysis_interval: "6h"
  report_interval: "1w"

analysis_config:
  min_data_points: 100
  confidence_level: 0.95
  outlier_detection: true

metadata:
  created_by: "factory"
  version: "1.0"
  tags:
    - "analytics"
    - "insights"
    - "data"
